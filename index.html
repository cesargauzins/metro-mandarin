<style>
/* Layout: plan de métro de Shanghai — chaque thème est une ligne colorée, chaque leçon une station ; colonne de tracé à gauche, libellés alignés à droite. */
:root{
  --bg:#E8ECF4; --surface:#FFFFFF; --sunk:#F1F4F9; --ink:#141A2C; --muted:#4F586E;
  --ctl:#7A8499; --rule:#B9C0CF; --track:#A9B1C3;
  --brand:#D9002A; --brand-deep:#9A001E; --brand-text:#C20026;
  --sel:#1A63C4; --sel-bg:#BFD5F5; --sel-ink:#0E3F84;
  --ok:#17782F; --ok-deep:#0F5520; --ok-bg:#B3E2BF; --ok-ink:#0C4A1C;
  --bad:#C81A35; --bad-deep:#8E0F22; --bad-bg:#F8CDD4; --bad-ink:#7A0C1D;
  --gold:#8F6200; --scrim:rgba(12,16,28,.55); --casing:#5C657A;
  --l1:#E3002B; --l2:#78B51A; --l3:#F2CB00; --l4:#4A2390; --l5:#944D9A; --l6:#D40068;
  --l7:#E96B00; --l8:#0088CC; --l9:#6EC1EA; --l10:#BBA3CE; --l11:#871C2B; --l12:#007A60;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --zh:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C111E; --surface:#182036; --sunk:#111829; --ink:#EEF1F8; --muted:#A9B2C6;
  --ctl:#6E7A96; --rule:#3A4560; --track:#46506B;
  --brand:#D9002A; --brand-deep:#8A0019; --brand-text:#FF6680;
  --sel:#6AA8FF; --sel-bg:#24406E; --sel-ink:#D6E6FF;
  --ok:#17782F; --ok-deep:#0D4D1C; --ok-bg:#1C4A2A; --ok-ink:#B9F0C8;
  --bad:#C81A35; --bad-deep:#7C0C1D; --bad-bg:#6E2332; --bad-ink:#FFC9D1;
  --gold:#F2C14E; --scrim:rgba(0,0,0,.6); --casing:#0C111E;
  --l4:#8461D1; --l5:#B66CBD; --l11:#C9485C; --l12:#16A884; --l8:#1A9BE0;
  color-scheme:dark }
}
:root[data-theme="dark"]{
  --bg:#0C111E; --surface:#182036; --sunk:#111829; --ink:#EEF1F8; --muted:#A9B2C6;
  --ctl:#6E7A96; --rule:#3A4560; --track:#46506B;
  --brand:#D9002A; --brand-deep:#8A0019; --brand-text:#FF6680;
  --sel:#6AA8FF; --sel-bg:#24406E; --sel-ink:#D6E6FF;
  --ok:#17782F; --ok-deep:#0D4D1C; --ok-bg:#1C4A2A; --ok-ink:#B9F0C8;
  --bad:#C81A35; --bad-deep:#7C0C1D; --bad-bg:#6E2332; --bad-ink:#FFC9D1;
  --gold:#F2C14E; --scrim:rgba(0,0,0,.6); --casing:#0C111E;
  --l4:#8461D1; --l5:#B66CBD; --l11:#C9485C; --l12:#16A884; --l8:#1A9BE0;
  color-scheme:dark
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
[lang="zh-CN"]{font-family:var(--zh)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
.ico{display:inline-flex;width:1.25em;height:1.25em;flex:none}
.ico svg{width:100%;height:100%}
.muted{color:var(--muted)}

/* ---------- app shell ---------- */
.app{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
.side,.rail{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:10px;font:800 21px/1 var(--display);letter-spacing:-.01em;white-space:nowrap}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font:700 17px/1 var(--zh)}
.chips{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font:800 15px/1 var(--body);padding:7px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--rule);font-variant-numeric:tabular-nums}
.chip .ico{width:18px;height:18px}
.chip.fire{color:#E8590C}
.chip.fire.off{color:var(--muted)}
.chip.xp{color:var(--gold)}
.chip.sync{font-weight:700;font-size:12px;color:var(--muted)}
main{min-width:0;padding-block:18px 110px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--rule);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;font:700 12px/1 var(--body);color:var(--muted)}
.tab .ico{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--sel-ink);background:var(--sel-bg)}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;background:none;border:2px solid transparent;border-radius:14px;padding:11px 14px;font:800 15px/1 var(--body);letter-spacing:.02em;color:var(--muted);text-align:left}
.navbtn .ico{width:24px;height:24px}
.navbtn:hover{background:var(--surface)}
.navbtn[aria-current="page"]{color:var(--sel-ink);background:var(--sel-bg);border-color:var(--sel)}

@media (min-width:1100px){
  .app{grid-template-columns:220px minmax(0,1fr) 310px;gap:36px}
  .topbar,.tabbar,.summary-inline{display:none !important}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;align-self:start;padding-block:24px;height:100vh}
  .side .brand{margin:0 6px 18px}
  .rail{display:flex;flex-direction:column;gap:18px;position:sticky;top:0;align-self:start;padding-block:24px}
  main{padding-block:24px 60px}
}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(20,26,44,.06)}
.panel h3{font-size:18px;margin-bottom:12px}
.kicker{font:800 12px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* summary */
.summary{display:grid;gap:14px}
.sum-top{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:58px;height:58px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 13px/1 var(--body);font-variant-numeric:tabular-nums}
.sum-txt{min-width:0}
.sum-txt strong{display:block;font:800 22px/1.1 var(--display)}
.pace{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
.pill{display:inline-block;font:800 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)}
.pill.warn{background:#FCE3B5;color:#6B4300}
.pill.bad{background:var(--bad-bg);color:var(--bad-ink)}
.summary-inline{margin-bottom:22px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;
  font:800 15px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;background:var(--brand);color:#fff;
  box-shadow:0 4px 0 var(--brand-deep);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-deep)}
.btn:disabled{background:var(--sunk);color:var(--muted);box-shadow:0 4px 0 var(--rule);cursor:default}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-deep)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--ctl);box-shadow:0 3px 0 var(--ctl)}
.btn.small{padding:9px 13px;font-size:13px;border-radius:12px}
.btn.wide{width:100%}
.iconbtn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;border:2px solid var(--ctl);background:var(--surface);box-shadow:0 3px 0 var(--ctl);color:var(--sel)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ctl)}
.iconbtn .ico{width:22px;height:22px}
.iconbtn.big{width:84px;height:84px;border-radius:24px;background:var(--sel);color:#fff;border-color:var(--sel);box-shadow:0 5px 0 var(--sel-ink)}
.iconbtn.big .ico{width:40px;height:40px}
.iconbtn.slow{width:auto;padding:0 12px;font:800 13px/1 var(--body);color:var(--ink)}

/* ---------- path (metro map) ---------- */
.unit{margin-bottom:34px}
.unit-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.badge{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font:800 24px/1 var(--display);flex:none}
.unit-head h2{font-size:24px}
.unit-head .kicker{margin-bottom:3px}
.unit-head .count{margin-left:auto;font:800 14px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.stations{position:relative}
.stations svg.track{position:absolute;left:0;top:0;width:116px;pointer-events:none;overflow:visible}
.st{position:relative;display:grid;grid-template-columns:minmax(0,1fr);align-content:center;gap:2px;width:100%;min-height:92px;
  padding:10px 8px 10px 120px;background:none;border:0;text-align:left;border-radius:14px}
.st-right{margin-top:6px;min-height:28px}
@media (min-width:640px){
  .st{grid-template-columns:minmax(0,1fr) auto;column-gap:14px}
  .st-name,.st-meta{grid-column:1}
  .st-right{grid-column:2;grid-row:1/span 2;margin-top:0}
}
.st:hover:not(:disabled){background:var(--surface)}
.st:disabled{cursor:default}
.st-name{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.st-name b{font:700 19px/1.2 var(--zh)}
.st-name i{font-style:normal;font-size:13px;color:var(--muted)}
.st-meta{font:700 15px/1.3 var(--body);margin-top:2px}
.st.locked .st-name b,.st.locked .st-meta{color:var(--muted)}
.st-right{display:flex;align-items:center;gap:8px}
.st-state{font:800 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.go{display:inline-flex;align-items:center;padding:10px 14px;border-radius:12px;color:#fff;font:800 13px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.friends{display:flex}
.friends .seal{margin-left:-8px;border:2px solid var(--bg)}
.friends .seal:first-child{margin-left:0}
.friends em{font:800 12px/1 var(--body);font-style:normal;color:var(--muted);align-self:center;margin-left:4px}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.9);opacity:0}}

/* seals (zodiac avatars) */
.seal{display:inline-grid;place-items:center;flex:none;border-radius:50%;font-family:var(--zh);font-weight:700}

/* ---------- league ---------- */
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--rule);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font:800 14px/1 var(--body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.view-head h1{font-size:32px}
.board{display:grid}
.row{display:grid;grid-template-columns:28px auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row.me{background:var(--sel-bg);border-radius:12px;border-bottom-color:transparent;padding-inline:10px;margin-inline:-6px}
.rank{font:800 17px/1 var(--display);text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.rank.r1{color:var(--gold)}
.who{min-width:0}
.who b{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{font-size:13px;color:var(--muted)}
.score{font:800 16px/1 var(--body);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.score small{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-top:3px}
.bar{height:8px;border-radius:99px;background:var(--sunk);border:1px solid var(--rule);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand)}
.empty{padding:18px 4px;color:var(--muted);font-size:15px}

/* ---------- lexique ---------- */
.search{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--ctl);background:var(--surface);font:600 16px var(--body);color:var(--ink)}
.tones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tone{display:grid;justify-items:center;gap:2px;padding:10px 4px;border-radius:14px;border:2px solid var(--ctl);background:var(--surface);box-shadow:0 3px 0 var(--ctl)}
.tone svg{width:44px;height:22px}
.tone b{font:700 22px/1 var(--zh)}
.tone span{font-size:13px;font-weight:700}
.tone small{font-size:11px;color:var(--muted)}
.lex-group{margin-top:26px}
.lex-group h3{display:flex;align-items:center;gap:10px;font-size:19px;margin-bottom:6px}
.lex-group h3 .badge{width:28px;height:28px;font-size:16px;border-radius:8px}
.lex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--rule)}
.lex b{font:700 20px/1.25 var(--zh);display:block}
.lex .py{color:var(--sel);font-weight:700;font-size:14px}
.lex .fr{font-size:15px}
.lex .acts{display:flex;gap:8px}
.weak{font:800 10px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--bad-ink);background:var(--bad-bg);padding:3px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}

/* ---------- profil ---------- */
.me-head{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.me-head h1{font-size:30px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:12px}
.stat b{display:block;font:800 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:700;color:var(--muted)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-auto-columns:minmax(0,1fr);gap:4px;max-width:560px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--sunk);border:1px solid var(--rule)}
.heat i.h1{background:color-mix(in srgb,var(--brand) 30%,var(--surface));border-color:transparent}
.heat i.h2{background:color-mix(in srgb,var(--brand) 60%,var(--surface));border-color:transparent}
.heat i.h3{background:var(--brand);border-color:transparent}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}
.form{display:grid;gap:16px}
.field{display:grid;gap:6px}
.field label,.field .lab{font:800 13px/1 var(--body);letter-spacing:.04em;color:var(--muted)}
.field input,.field select{padding:11px 12px;border-radius:12px;border:2px solid var(--ctl);background:var(--surface);color:var(--ink);font:600 16px var(--body);width:100%}
.check{display:flex;align-items:center;gap:10px;font-weight:700}
.check input{width:22px;height:22px;accent-color:var(--sel)}
.zodiac{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.zodiac button{display:grid;justify-items:center;gap:4px;padding:8px 2px;border-radius:14px;border:2px solid var(--rule);background:var(--surface);font-size:11px;font-weight:700}
.zodiac button[aria-pressed="true"]{border-color:var(--sel);background:var(--sel-bg);color:var(--sel-ink)}
.goals{display:flex;flex-wrap:wrap;gap:8px}
.goals button{padding:9px 12px;border-radius:12px;border:2px solid var(--rule);background:var(--surface);font:800 14px/1 var(--body)}
.goals button[aria-pressed="true"]{border-color:var(--sel);background:var(--sel-bg);color:var(--sel-ink)}
.cols{display:grid;gap:18px}
.cols>*{min-width:0}

/* ---------- lesson ---------- */
.lesson{position:fixed;inset:0;z-index:60;background:var(--surface);display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding-top:env(safe-area-inset-top,0px)}
.l-wrap{width:100%;max-width:700px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.l-top{display:flex;align-items:center;gap:14px;padding-block:14px}
.l-close{background:none;border:0;color:var(--muted);width:36px;height:36px;display:grid;place-items:center;border-radius:10px}
.l-close .ico{width:26px;height:26px}
.prog{flex:1;height:16px;border-radius:99px;background:var(--sunk);border:1px solid var(--rule);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;transition:width .35s ease}
.l-body{overflow-y:auto;padding-block:8px 24px}
.l-body .l-wrap{display:grid;gap:20px;align-content:start}
.q-kicker{font:800 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase}
.q-title{font:800 26px/1.15 var(--display)}
.prompt{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.prompt .zh{font:700 34px/1.25 var(--zh)}
.prompt .py{color:var(--sel);font-weight:700;font-size:17px}
.prompt .fr{font-size:20px;font-weight:700}
.bubble{position:relative;background:var(--sunk);border:2px solid var(--rule);border-radius:18px;padding:14px 16px;display:grid;gap:4px}
.who-says{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--muted);font-size:14px}
.card-new{display:grid;justify-items:center;text-align:center;gap:10px;padding:26px 16px;border-radius:22px;border:2px solid var(--rule);background:var(--sunk)}
.card-new .zh{font:700 52px/1.2 var(--zh)}
.card-new .py{font-size:22px;color:var(--sel);font-weight:800}
.card-new .fr{font-size:20px;font-weight:700}
.note{font-size:14px;color:var(--muted);max-width:46ch}
.audio-row{display:flex;gap:10px;justify-content:center}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:16px;border:2px solid var(--ctl);background:var(--surface);box-shadow:0 3px 0 var(--ctl);min-height:58px}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ctl)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--rule);display:grid;place-items:center;font:800 12px/1 var(--body);color:var(--muted)}
.opt .t{min-width:0;display:grid;gap:2px}
.opt .t b{font:700 21px/1.25 var(--zh)}
.opt .t span{font-size:13px;color:var(--sel);font-weight:700}

function tapWords(it,known,cls){
  const info=h("div",{class:"winfo"},"Touche un mot pour voir sa traduction.");
  const line=h("div",{class:"words "+(cls||""),lang:"zh-CN"});
  const show=(b,z,py)=>{line.querySelectorAll(".w").forEach(x=>x.classList.toggle("on",x===b)); const isNew=known&&!known.has(z);
    info.replaceChildren(...[zhEl("b",z)," ",h("span",{class:"p"},py)," · "+(gloss(z)||"—"),isNew?h("span",{class:"newtag"},"nouveau"):null].filter(Boolean));};
  it.tok.forEach((tk,i)=>{const z=tk.replace(PUNCT,""), punct=tk.slice(z.length), py=it.pyt[i].replace(PUNCT,"").trim();
    if(!z){line.append(tk);return;}
    const b=h("span",{class:"w"+(known&&!known.has(z)?" new":""),tabindex:"0",role:"button"},z);
    b.addEventListener("pointerdown",e=>e.stopPropagation());
    b.addEventListener("click",e=>{e.stopPropagation();show(b,z,py);say(z);});

}

  ds=ds.concat(shuffle(ITEMS.filter(x=>x.u===it.u&&ok(x)&&!ds.includes(x)))).slice(0,n);
  if(ds.length<n) ds=ds.concat(shuffle(ITEMS.filter(x=>ok(x)&&!ds.includes(x))).slice(0,n-ds.length));

}

function confetti(){
